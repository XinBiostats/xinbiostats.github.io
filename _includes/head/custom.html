{% include base_path %}

<!-- start custom head snippets -->

<link rel="icon" href="{{ base_path }}/images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="{{ base_path }}/images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="{{ base_path }}/images/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon.png">
<link rel="manifest" href="{{ base_path }}/images/manifest.json">
<meta name="msapplication-TileColor" content="#0c111a">
<meta name="msapplication-config" content="{{ base_path }}/images/browserconfig.xml">
<meta name="theme-color" content="#ffffff">

<!-- description + link-preview card: the theme's seo.html emits neither -->
{% assign page_desc = page.description | default: site.description %}
<meta name="description" content="{{ page_desc | strip_html | strip_newlines | truncate: 200 | escape_once }}">
{% unless page.excerpt %}<meta property="og:description" content="{{ page_desc | strip_html | strip_newlines | truncate: 200 | escape_once }}">{% endunless %}
{% unless page.header.image or page.header.overlay_image %}<meta property="og:image" content="{{ site.og_image | prepend: '/images/' | prepend: site.url }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">{% endunless %}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | default: site.title | strip_html | escape_once }}">
<meta name="twitter:description" content="{{ page_desc | strip_html | strip_newlines | truncate: 200 | escape_once }}">
<meta name="twitter:image" content="{{ site.og_image | prepend: '/images/' | prepend: site.url }}">
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>


<!-- Support for MatJax -->
<script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<!-- end custom head snippets -->
